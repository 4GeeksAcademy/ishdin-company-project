[project]
name = "trackflow-supplier-api"
version = "0.1.0"
description = "TrackFlow supplier management API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "email-validator>=2.0,<3.0",
    "libpass[bcrypt]>=1.9.3",
    "pydantic>=2.7,<3.0",
    "python-jose[cryptography]>=3.5.0",
    "tinydb>=4.8,<5.0",
    "resend>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["seed", "database", "models"]

[project]
name = "trackflow-supplier-api"
version = "0.1.0"
description = "TrackFlow supplier management API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "email-validator>=2.0,<3.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "python-dotenv>=1.0,<2.0",
    "tinydb>=4.8,<5.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=4.0.1,<4.1",
    "resend>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["seed", "database", "models"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["auth"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
